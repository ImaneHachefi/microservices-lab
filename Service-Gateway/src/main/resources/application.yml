server:
  port: 8888

spring:
  application:
    name: Gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-customer
              uri: lb://SERVICE-CUSTOMER
              predicates:
                - Path=/api/client/**

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${server.port}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8761/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO